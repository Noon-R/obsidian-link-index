[package]
name = "link-index-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "link-index-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
scraper = "0.19"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
